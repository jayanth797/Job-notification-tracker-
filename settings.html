<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Job Notification Tracker</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Top Bar -->
    <nav class="top-bar">
        <div class="brand-name">Job Notification Tracker</div>

        <button class="mobile-menu-btn" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul class="nav-links">
            <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
            <li><a href="saved.html" class="nav-link">Saved</a></li>
            <li><a href="digest.html" class="nav-link">Digest</a></li>
            <li><a href="settings.html" class="nav-link active">Settings</a></li>
            <li><a href="proof.html" class="nav-link">Proof</a></li>
        </ul>
    </nav>

    <!-- Context Header -->
    <header class="context-header">
        <h1 class="context-headline">Tracking Preferences</h1>
        <p class="context-subtext">Configure parameters for your daily job notifications.</p>
    </header>

    <!-- Main Layout -->
    <main class="main-layout">
        <section class="primary-workspace">
            <div class="card">
                <div class="input-group">
                    <label class="label" for="role-keywords">Role Keywords</label>
                    <input type="text" id="role-keywords"
                        placeholder="e.g. Frontend Engineer, Product Designer, React Developer">
                </div>

                <div class="input-group">
                    <label class="label" for="locations">Preferred Locations</label>
                    <input type="text" id="locations" placeholder="e.g. San Francisco, New York, London">
                </div>

                <div class="input-group">
                    <label class="label">Work Mode</label>
                    <div style="display: flex; gap: 24px; margin-top: 8px;">
                        <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9375rem;">
                            <input type="radio" name="mode" value="remote" style="accent-color: var(--color-accent);">
                            Remote
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9375rem;">
                            <input type="radio" name="mode" value="hybrid" style="accent-color: var(--color-accent);">
                            Hybrid
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9375rem;">
                            <input type="radio" name="mode" value="onsite" style="accent-color: var(--color-accent);">
                            Onsite
                        </label>
                    </div>
                </div>

                <div class="input-group">
                    <label class="label" for="experience">Experience Level</label>
                    <select id="experience"
                        style="width: 100%; padding: 12px 16px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: 1rem; background-color: var(--color-white);">
                        <option value="">Select Level</option>
                        <option value="entry">Entry Level (0-2 years)</option>
                        <option value="mid">Mid Level (3-5 years)</option>
                        <option value="senior">Senior Level (5+ years)</option>
                        <option value="lead">Lead / Manager</option>
                    </select>
                </div>

                <div style="margin-top: 32px;">
                    <button class="btn btn-primary">Save Preferences</button>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
