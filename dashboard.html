<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Job Notification Tracker</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Top Bar -->
    <nav class="top-bar">
        <div class="brand-name">Job Notification Tracker</div>

        <button class="mobile-menu-btn" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul class="nav-links">
            <li><a href="dashboard.html" class="nav-link active">Dashboard</a></li>
            <li><a href="saved.html" class="nav-link">Saved</a></li>
            <li><a href="digest.html" class="nav-link">Digest</a></li>
            <li><a href="settings.html" class="nav-link">Settings</a></li>
            <li><a href="proof.html" class="nav-link">Proof</a></li>
            <li><a href="test.html" class="nav-link">Test</a></li>
            <li><a href="ship.html" class="nav-link" style="color: #666;">Ship</a></li>
        </ul>
    </nav>

    <!-- Context Header -->
    <header class="context-header">
        <h1 class="context-headline">Dashboard</h1>
    </header>

    <!-- Main Layout -->
    <main class="main-layout">

        <!-- Filter Bar -->
        <section class="filter-bar" style="align-items: center;">
            <input type="text" id="search-filter" class="filter-input" placeholder="Search title or company...">

            <select id="location-filter" class="filter-select">
                <option value="">All Locations</option>
                <option value="Bangalore">Bangalore</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Pune">Pune</option>
                <option value="Gurgaon">Gurgaon</option>
                <option value="Chennai">Chennai</option>
                <option value="Remote">Remote</option>
            </select>

            <select id="mode-filter" class="filter-select">
                <option value="">All Modes</option>
                <option value="Remote">Remote</option>
                <option value="Hybrid">Hybrid</option>
                <option value="Onsite">Onsite</option>
            </select>

            <select id="experience-filter" class="filter-select">
                <option value="">Experience</option>
                <option value="Fresher">Fresher</option>
                <option value="0-1">0-1 Years</option>
                <option value="1-3">1-3 Years</option>
                <option value="3-5">3-5 Years</option>
            </select>

            <select id="source-filter" class="filter-select">
                <option value="">All Sources</option>
                <option value="LinkedIn">LinkedIn</option>
                <option value="Naukri">Naukri</option>
                <option value="Indeed">Indeed</option>
            </select>

            <select id="sort-filter" class="filter-select">
                <option value="match_score">Best Match</option>
                <option value="latest">Latest</option>
                <option value="salary">Highest Salary</option>
            </select>

            <select id="status-filter" class="filter-select">
                <option value="">All Statuses</option>
                <option value="Not Applied">Not Applied</option>
                <option value="Applied">Applied</option>
                <option value="Rejected">Rejected</option>
                <option value="Selected">Selected</option>
            </select>

            <!-- Toggle Switch -->
            <div style="display: flex; align-items: center; gap: 8px; margin-left: auto;">
                <label class="switch">
                    <input type="checkbox" id="match-toggle-checkbox">
                    <span class="slider round"></span>
                </label>
                <label for="match-toggle-checkbox" style="font-size: 0.9rem; font-weight: 500;">Show Matches
                    Only</label>
            </div>
        </section>

        <!-- Job Grid -->
        <section class="primary-workspace">
            <div id="job-container" class="job-grid">
                <!-- Javascript will populate this -->
            </div>
        </section>
    </main>

    <!-- Modal -->
    <div id="job-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-body">
                <!-- Dynamic Content -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script src="jobs-data.js"></script>
    <script src="app.js"></script>
</body>

</html>
