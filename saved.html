<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Jobs - Job Notification Tracker</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Top Bar -->
    <nav class="top-bar">
        <div class="brand-name">Job Notification Tracker</div>

        <button class="mobile-menu-btn" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul class="nav-links">
            <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
            <li><a href="saved.html" class="nav-link active">Saved</a></li>
            <li><a href="digest.html" class="nav-link">Digest</a></li>
            <li><a href="settings.html" class="nav-link">Settings</a></li>
            <li><a href="proof.html" class="nav-link">Proof</a></li>
        </ul>
    </nav>

    <!-- Context Header -->
    <header class="context-header">
        <h1 class="context-headline">Saved Jobs</h1>
    </header>

    <!-- Main Layout -->
    <main class="main-layout">
        <section class="primary-workspace">
            <div id="job-container" class="job-grid">
                <!-- Javascript will populate this with Saved Jobs -->
            </div>
        </section>
    </main>

    <!-- Modal -->
    <div id="job-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-body">
                <!-- Dynamic Content -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script src="jobs-data.js"></script>
    <script src="app.js"></script>
</body>

</html>
